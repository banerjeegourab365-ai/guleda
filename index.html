<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#08172d"/><title>GULE DA AI</title>
<link rel="manifest" href="manifest.json"/><link rel="icon" href="icon-192.png"/><link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#061326;color:#f5f8ff;font-family:Inter,'Hind Siliguri',sans-serif}.shell{max-width:520px;min-height:100vh;margin:auto;padding:18px 18px 12px;background:radial-gradient(ellipse at 50% 23%,#183b67 0,#0b2342 34%,#07162b 72%);display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ffbd67,#ff7a45);display:grid;place-items:center;color:#15243a;font-size:23px;font-weight:800}.brand b{display:block;letter-spacing:2px;font-size:15px}.brand small{font-size:9px;color:#8ca8c8;letter-spacing:1.8px}.sound{background:#173657;border:1px solid #2a5278;color:#dcecff;border-radius:12px;padding:10px;display:grid;place-items:center}.sound svg{width:18px}.hero{text-align:center;position:relative;padding:22px 0 16px;overflow:hidden}.avatar{height:206px;width:190px;margin:0 auto;position:relative;z-index:1;filter:drop-shadow(0 18px 20px #020a17aa);animation:bob 3s ease-in-out infinite}.face{position:absolute;z-index:2;top:24px;left:39px;width:112px;height:119px;border-radius:48% 48% 46% 46%;background:linear-gradient(135deg,#f6c18e,#d98b5d);border:3px solid #9f5d40}.hair{position:absolute;z-index:3;top:14px;left:44px;width:105px;height:39px;background:#201b1b;border-radius:60% 55% 20% 20%;transform:rotate(-3deg)}.body{position:absolute;bottom:0;left:13px;width:164px;height:78px;border-radius:70px 70px 22px 22px;background:linear-gradient(130deg,#f1a94f,#d56b32);border:3px solid #a94f2b;display:grid;place-items:center;color:#fff4df;font-size:23px;font-weight:800}.brow{position:absolute;top:40px;width:23px;height:5px;border-radius:100%;background:#38221c}.b1{left:17px}.b2{right:17px}.glasses{position:absolute;top:47px;left:9px;display:flex;gap:9px}.glasses i{width:38px;height:27px;border:3px solid #252a30;border-radius:9px;background:#ffffff22}.eyes{position:absolute;top:57px;left:23px;display:flex;gap:33px}.eyes i{width:6px;height:8px;background:#211b18;border-radius:50%}.nose{position:absolute;top:67px;left:51px;width:13px;height:17px;border-radius:50%;border-right:3px solid #b56d4c}.moustache{position:absolute;top:84px;left:28px;width:57px;height:17px;background:#2a211f;clip-path:polygon(0 0,42% 20%,50% 0,58% 20%,100% 0,87% 75%,65% 100%,50% 48%,35% 100%,13% 75%)}.smile{position:absolute;top:103px;left:48px;width:24px;height:8px;border-bottom:2px solid #8e4537;border-radius:50%}.body span{margin-top:-13px}.orbit{position:absolute;border:1px solid #4d85bd35;border-radius:50%;left:50%;transform:translateX(-50%)}.orbit1{width:260px;height:190px;top:30px}.orbit2{width:320px;height:230px;top:10px}.status{position:relative;z-index:2;margin:10px auto 7px;border:1px solid #2e5c7b;background:#102f4d;padding:6px 11px;border-radius:20px;font-size:9px;letter-spacing:1.2px;color:#b7d8ef;width:max-content}.status span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#48e4a0;margin-right:6px;box-shadow:0 0 8px #48e4a0}h1{font-family:'Hind Siliguri',sans-serif;font-size:30px;margin:4px 0;color:#fff} .hero p{margin:0;color:#a8bfd8;font-size:12px}.chat{background:#0b1d33;border:1px solid #254563;border-radius:20px;padding:14px;box-shadow:0 14px 35px #020b18aa;display:flex;flex-direction:column;min-height:300px;flex:1}.chatTitle{display:flex;align-items:center;justify-content:space-between;color:#8eaccb;font-size:10px;letter-spacing:1px;padding-bottom:12px;border-bottom:1px solid #1d3854}.chatTitle span,.chatTitle label{display:flex;align-items:center;gap:7px}.chatTitle select{background:transparent;color:#dcecff;border:0;outline:0;font-size:11px}.chatTitle option{color:#111}.messages{flex:1;min-height:160px;max-height:290px;overflow:auto;padding:14px 2px}.msg{display:flex;margin:9px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:10px 13px;border-radius:15px;background:#173958;color:#e8f4ff;font-size:13px;line-height:1.5;white-space:pre-wrap}.user .bubble{background:linear-gradient(120deg,#f49a4c,#db6e39);color:#201b19;border-bottom-right-radius:4px}.assistant .bubble{border-bottom-left-radius:4px}.typing span{margin-left:7px;letter-spacing:2px;animation:pulse 1s infinite}.composer{display:flex;gap:8px;align-items:center;background:#102944;border:1px solid #2b4b6a;border-radius:15px;padding:6px}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font:13px Inter}.composer input::placeholder{color:#7f9bb7}.composer button{border:0;display:grid;place-items:center;cursor:pointer}.mic,.send{width:38px;height:38px;border-radius:12px}.mic{background:#1b4163;color:#c6e4ff}.mic.active{background:#d84e4e;color:white;animation:pulse .8s infinite}.send{background:#f39a4e;color:#1b2430}.send:disabled{opacity:.45}.hint{display:flex;align-items:center;gap:5px;justify-content:center;color:#7292b2;font-size:10px;padding-top:10px}footer{text-align:center;color:#5d7b9c;font-size:10px;padding:12px 0 0}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{50%{opacity:.5}}@media(min-height:850px){.hero{padding-top:36px;padding-bottom:24px}.avatar{transform:scale(1.08);margin-bottom:10px}.messages{max-height:360px}}
.sound,.mic,.send{font-size:18px;cursor:pointer}.gimg{display:block;width:190px;height:240px;object-fit:cover;object-position:top;margin:0 auto;border-radius:28px;border:3px solid #2a5278;position:relative;z-index:1;box-shadow:0 18px 30px #020a17aa;animation:bob 3s ease-in-out infinite}.gimg.talk{animation:talk .5s ease-in-out infinite}@keyframes talk{50%{transform:scale(1.04) rotate(-1deg)}}</style></head><body>
<main class="shell">
<header><div class="brand"><div class="logo">গু</div><div><b>GULE DA</b><small>YOUR DESI AI BUDDY</small></div></div>
<button class="sound" id="sound" aria-label="Toggle voice">🔊</button></header>
<section class="hero"><div class="orbit orbit1"></div><div class="orbit orbit2"></div>
<img class="gimg" src="gule.jpg" alt="GULE DA"/>
<div class="status"><span></span> ONLINE • READY TO CHAT</div><h1>কী খবর দাদা?</h1><p>Your friendly neighbourhood AI is here.</p></section>
<section class="chat"><div class="chatTitle"><span>💬 CHAT WITH GULE DA</span>
<label>🌐<select id="lang"><option>Auto</option><option>Bengali</option><option>Hindi</option><option>English</option></select></label></div>
<div class="messages" id="msgs"></div>
<div class="composer"><button class="mic" id="mic">🎤</button><input id="inp" placeholder="Ask GULE DA anything..."/><button class="send" id="send">➤</button></div>
<div class="hint">Bengali • Hindi • English</div></section>
<footer>Made with ❤️ for curious minds</footer></main>
<script src="https://js.puter.com/v2/"></script>
<script>
const $=id=>document.getElementById(id);
let history=[{role:"assistant",text:"আরে দাদা! আমি GULE DA 😎 তোমার AI বন্ধু। কী জানতে চাও?"}];
let speaking=true,busy=false;
const msgs=$("msgs");
function render(extra){msgs.innerHTML="";history.concat(extra?[extra]:[]).forEach(m=>{const d=document.createElement("div");d.className="msg "+m.role;const b=document.createElement("div");b.className="bubble"+(m.typing?" typing":"");b.textContent=m.text;d.appendChild(b);msgs.appendChild(d)});msgs.scrollTop=msgs.scrollHeight}
const langCode=()=>({Bengali:"bn-IN",Hindi:"hi-IN"}[$("lang").value]||"en-IN");
function say(t){if(!speaking||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=langCode();u.rate=.96;u.onstart=()=>document.querySelector(".gimg").classList.add("talk");u.onend=u.onerror=()=>document.querySelector(".gimg").classList.remove("talk");speechSynthesis.speak(u)}
function textOf(r){if(typeof r==="string")return r;const c=r?.message?.content;if(typeof c==="string")return c;if(Array.isArray(c))return c.map(p=>p.text||"").join("");return r?.text||""}
async function send(v){v=(v??$("inp").value).trim();if(!v||busy)return;busy=true;$("inp").value="";
 const prior=history.slice(-12);history.push({role:"user",text:v});render({role:"assistant",text:"GULE DA is thinking •••",typing:true});
 const lang=$("lang").value;
 const sys=`You are GULE DA, a warm, funny, helpful Indian male AI companion. Be respectful, clear and concise. Reply in ${lang==="Auto"?"the user's language":lang}.`;
 const messages=[{role:"system",content:sys},...prior.map(m=>({role:m.role,content:m.text})),{role:"user",content:v}];
 try{const r=await puter.ai.chat(messages);const t=textOf(r)||"I couldn't form a reply. Try again.";history.push({role:"assistant",text:t});render();say(t)}
 catch(e){history.push({role:"assistant",text:"একটু সমস্যা হচ্ছে: "+(e?.message||"please try again")});render()}
 busy=false}
$("send").onclick=()=>send();$("inp").onkeydown=e=>e.key==="Enter"&&send();
$("sound").onclick=()=>{speaking=!speaking;$("sound").textContent=speaking?"🔊":"🔇";if(!speaking)speechSynthesis.cancel()};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Voice input is not supported here. Try Chrome.");return}
 const r=new SR();r.lang=langCode();r.interimResults=false;r.onstart=()=>$("mic").classList.add("active");r.onend=r.onerror=()=>$("mic").classList.remove("active");r.onresult=e=>send(e.results[0][0].transcript);r.start()};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
